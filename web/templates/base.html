<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AI视频智能分析系统{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        body { padding-top: 56px; }
        .sidebar { min-height: calc(100vh - 56px); background: #f8f9fa; border-right: 1px solid #dee2e6; }
        .sidebar .nav-link { color: #333; padding: 0.6rem 1rem; border-radius: 0; }
        .sidebar .nav-link:hover { background: #e9ecef; }
        .sidebar .nav-link.active { background: #0d6efd; color: white; }
        .sidebar .nav-link i { margin-right: 8px; width: 20px; text-align: center; }
        .metric-card { transition: transform 0.2s; border: none; }
        .metric-card:hover { transform: translateY(-3px); box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .alarm-critical { border-left: 4px solid #dc3545 !important; }
        .alarm-warning { border-left: 4px solid #ffc107 !important; }
        .alarm-info { border-left: 4px solid #0dcaf0 !important; }
        .live-indicator { width: 8px; height: 8px; background: #dc3545; border-radius: 50%; display: inline-block; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }
        .toast-container { position: fixed; top: 70px; right: 20px; z-index: 9999; }
        .video-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 15px; }
        .video-item { background: #000; border-radius: 8px; overflow: hidden; aspect-ratio: 16/9; position: relative; }
        .video-item video { width: 100%; height: 100%; object-fit: contain; }
        .video-label { position: absolute; bottom: 0; left: 0; right: 0; background: rgba(0,0,0,0.7); color: white; padding: 5px 10px; font-size: 13px; }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
    <nav class="navbar navbar-dark bg-dark fixed-top">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">
                <i class="bi bi-camera-video"></i> AI视频智能分析系统
                <span class="badge bg-danger ms-2" style="font-size: 10px; vertical-align: middle;">BETA</span>
            </a>
            <div class="d-flex align-items-center gap-2">
                <span class="text-white small"><span class="live-indicator"></span> 系统运行中</span>
                <a href="/metrics" target="_blank" class="btn btn-outline-light btn-sm"><i class="bi bi-graph-up"></i> 指标</a>
                <a href="http://127.0.0.1:9001" target="_blank" class="btn btn-outline-light btn-sm"><i class="bi bi-cloud"></i> MinIO</a>
            </div>
        </div>
    </nav>

    <div class="container-fluid">
        <div class="row g-0">
            <nav class="col-md-2 d-md-block sidebar collapse">
                <div class="position-sticky pt-3">
                    <ul class="nav flex-column">
                        <li class="nav-item">
                            <a class="nav-link {% if request.path == '/' %}active{% endif %}" href="/">
                                <i class="bi bi-speedometer2"></i> 监控大盘
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link {% if request.path == '/tasks' %}active{% endif %}" href="/tasks">
                                <i class="bi bi-list-task"></i> 分析任务
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link {% if request.path == '/alarms' %}active{% endif %}" href="/alarms">
                                <i class="bi bi-exclamation-triangle"></i> 告警记录
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link {% if request.path == '/rules' %}active{% endif %}" href="/rules">
                                <i class="bi bi-file-text"></i> 规范规则
                            </a>
                        </li>
                    </ul>
                    <hr>
                    <div class="px-3 small text-muted">
                        <div><strong>技术栈:</strong></div>
                        <div>YOLOv8 + VLM + ChromaRAG</div>
                        <div>Redis + MySQL + MinIO</div>
                    </div>
                </div>
            </nav>
            <main class="col-md-10 ms-sm-auto px-md-4 py-4">
                {% block content %}{% endblock %}
            </main>
        </div>
    </div>

    <div class="toast-container" id="toast-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // SSE实时告警推送
        function connectSSE() {
            const evtSource = new EventSource('/events');
            evtSource.onmessage = function(e) {
                const alarm = JSON.parse(e.data);
                showAlarmToast(alarm);
            };
            evtSource.onerror = function() {
                evtSource.close();
                setTimeout(connectSSE, 5000);
            };
        }

        function showAlarmToast(alarm) {
            const container = document.getElementById('toast-container');
            const colorClass = alarm.severity === 'critical' ? 'bg-danger' : 
                              alarm.severity === 'warning' ? 'bg-warning text-dark' : 'bg-info';
            const toast = document.createElement('div');
            toast.className = `toast align-items-center text-white ${colorClass} border-0 show`;
            toast.innerHTML = `
                <div class="d-flex">
                    <div class="toast-body">
                        <strong><i class="bi bi-exclamation-triangle"></i> ${alarm.title}</strong><br>
                        <small>${alarm.description || ''}</small>
                    </div>
                    <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
                </div>
            `;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 8000);
            if (window.Notification && Notification.permission === 'granted') {
                new Notification('告警通知', { body: alarm.title, icon: '/static/warning.png' });
            }
        }

        // 请求通知权限
        if (window.Notification && Notification.permission === 'default') {
            Notification.requestPermission();
        }

        connectSSE();
    </script>
    {% block extra_js %}{% endblock %}
</body>
</html>
